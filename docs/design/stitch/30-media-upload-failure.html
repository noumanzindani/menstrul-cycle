<div class="flex items-center gap-3 w-full">
<span class="material-symbols-outlined text-predicted-lavender-grey">cloud_off</span>
<h2 class="font-headline font-medium text-base text-warm-near-black">That didn't upload</h2>
</div>
<p class="text-sm text-warm-near-black/80 font-body leading-relaxed">
