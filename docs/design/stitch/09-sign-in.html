<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LunaTrack - Sign In</title>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#FFFFFF",
                        surface: "#FFFFFF",
                        primary: "#F7A8C4",
                        onPrimary: "#3A2A30",
                        textPrimary: "#3A2A30",
                        textSecondary: "#7A6B71",
                        border: "#EAE5E7",
                        surfaceVariant: "#FCF5F7"
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.25rem",
                        "button": "1rem" // 16dp
                    },
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Public Sans", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    },
                    height: {
                        "button": "52px"
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.textPrimary');
        }
        
        /* Material 3 Outlined Text Field Styles */
        .m3-text-field {
            position: relative;
            padding-top: 8px;
        }
        
        .m3-input {
            width: 100%;
            height: 56px;
            padding: 0 16px;
            background: transparent;
            border: 1px solid theme('colors.border');
            border-radius: 4px;
            font-size: 16px;
            color: theme('colors.textPrimary');
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .m3-input:focus {
            outline: none;
            border-color: theme('colors.primary');
            box-shadow: inset 0 0 0 1px theme('colors.primary');
        }
        
        .m3-label {
            position: absolute;
            left: 12px;
            top: 24px; /* Centered in 56px height + 8px padding */
            background-color: theme('colors.background');
            padding: 0 4px;
            color: theme('colors.textSecondary');
            font-size: 16px;
            pointer-events: none;
            transition: top 0.2s, font-size 0.2s, color 0.2s;
        }
        
        .m3-input:focus + .m3-label,
        .m3-input:not(:placeholder-shown) + .m3-label {
            top: 0;
            font-size: 12px;
            color: theme('colors.primary');
        }
        
        .m3-input:not(:focus):not(:placeholder-shown) + .m3-label {
            color: theme('colors.textSecondary');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col items-center justify-center p-6 bg-background">
<!-- Main Container -->
<main class="w-full max-w-sm flex flex-col h-full min-h-[700px] justify-between">
<!-- Top Section: Logo & Brand -->
<div class="flex flex-col items-center mt-12 mb-10">
<!-- Simulated Month Ring Logo -->
<div class="relative w-16 h-16 mb-6 flex items-center justify-center">
<svg class="w-full h-full text-primary" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="4" viewbox="0 0 100 100">
<circle cx="50" cy="50" opacity="0.6" r="40" stroke-dasharray="8 6"></circle>
<circle cx="50" cy="50" r="40" stroke-dasharray="8 70" stroke-dashoffset="20"></circle>
</svg>
</div>
<h1 class="font-headline text-3xl font-bold tracking-tight text-textPrimary mb-2">LunaTrack</h1>
<p class="font-body text-base text-textSecondary text-center">Your cycle, kept private.</p>
</div>
<!-- Middle Section: Form -->
<div class="flex-grow flex flex-col justify-center space-y-6 w-full">
<!-- Form Fields -->
<div class="space-y-4">
<div class="m3-text-field">
<input class="m3-input" id="email" placeholder=" " required="" type="email"/>
<label class="m3-label" for="email">Email</label>
</div>
<div class="m3-text-field">
<input class="m3-input pr-12" id="password" placeholder=" " required="" type="password"/>
<label class="m3-label" for="password">Password</label>
<button aria-label="Toggle password visibility" class="absolute right-3 top-[22px] text-textSecondary hover:text-textPrimary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Action Buttons -->
<div class="space-y-3 pt-2">
<button class="w-full h-button bg-primary text-onPrimary font-label font-semibold text-base rounded-button hover:bg-opacity-90 transition-opacity flex items-center justify-center" type="submit">
                    Sign in
                </button>
<button class="w-full h-12 text-textPrimary font-label font-medium text-sm hover:bg-surfaceVariant rounded-lg transition-colors flex items-center justify-center" type="button">
                    Create an account
                </button>
<button class="w-full h-12 text-textSecondary font-label font-medium text-sm hover:bg-surfaceVariant rounded-lg transition-colors flex items-center justify-center" type="button">
                    Forgot password?
                </button>
</div>
</div>
<!-- Bottom Footer: Offline State -->
<div class="mt-8 pt-6 border-t border-border w-full flex flex-col items-center pb-8">
<div class="flex items-start bg-surfaceVariant p-4 rounded-xl mb-6 w-full">
<span class="material-symbols-outlined text-textSecondary mr-3 mt-0.5" style="font-variation-settings: 'FILL' 1;">cloud_off</span>
<p class="font-body text-sm text-textSecondary leading-relaxed">
                    Cloud sync is unavailable right now. Everything you log stays on this device.
                </p>
</div>
<button class="w-full h-button border border-border text-textPrimary font-label font-medium text-base rounded-button hover:bg-surfaceVariant transition-colors flex items-center justify-center" type="button">
                Continue without syncing
            </button>
</div>
</main>
<script>
        // Simple password toggle interaction
        const passwordInput = document.getElementById('password');
        const visibilityToggle = document.querySelector('[aria-label="Toggle password visibility"] span');
        
        visibilityToggle.parentElement.addEventListener('click', () => {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                visibilityToggle.textContent = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                visibilityToggle.textContent = 'visibility';
            }
        });
    </script>
</body></html>
