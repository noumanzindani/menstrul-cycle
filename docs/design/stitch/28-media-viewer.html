<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LunaTrack - Media Viewer</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        white: "#FFFFFF",
                        black: "#000000",
                        "primary-text": "#3A2A30",
                        "seed": "#F7A8C4",
                        "menstrual": "#D64F6E",
                        "follicular": "#6FB3A8",
                        "ovulatory": "#7E9CE8",
                        "luteal": "#D9A15B",
                        "fertile": "#9CCFC6",
                        "predicted": "#B0A8C0"
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px",
                        "card": "20px",
                        "button": "16px",
                        "chip": "12px"
                    },
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Public Sans", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"]
                    }
                }
            }
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-black h-screen w-full flex flex-col font-body overflow-hidden">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-[#3A2A30]/80 backdrop-blur-md elevation-0 flex items-center justify-between px-4 h-16 transition-opacity duration-200">
<button class="p-2 -ml-2 text-white hover:bg-[#F7A8C4]/10 rounded-full flex items-center justify-center transition-transform duration-200 active:opacity-70">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-lg font-medium text-white">6 September 2026</h1>
<button class="p-2 -mr-2 text-white hover:bg-[#F7A8C4]/10 rounded-full flex items-center justify-center transition-transform duration-200 active:opacity-70">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
</button>
</header>
<!-- Content Area (Letterboxed Image) -->
<main class="flex-1 w-full h-full flex items-center justify-center pt-16 pb-24">
<div class="w-full aspect-video flex items-center justify-center relative">
<img alt="Media content view" class="object-contain w-full h-full" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAW9OW-bn_E497z1jlzhs5T9st5ctT5Bwrr66H5g5RlcqZSZIo3d2Pxvf1Y6qGX8N0yKINniTxVvdHXtMApAu1H8tUh3P17VGxBK1h0mS-_ibFvGEmOixcW3YLtJrPXlCybj9F6asiXdUYXHfbcFtC5s3D5hJl1056nVS1Rcn3eRtzty70e9DymduFDbdepZ-pHk9HPGS4g8h6PvpqtfsDMoLJ5lzUrbftTd9f7W1fer1fcA6IGZog_9gO6Za5gt51FNtuqzTA1Vg"/>
</div>
</main>
<!-- Bottom Action Bar -->
<footer class="fixed bottom-0 w-full z-50 bg-[#3A2A30]/80 backdrop-blur-md px-4 py-4 flex gap-4 pb-safe">
<button class="flex-1 h-[52px] rounded-[16px] border border-white text-white font-label font-medium flex items-center justify-center gap-2 hover:bg-white/10 transition-colors active:opacity-70">
<span class="material-symbols-outlined" data-icon="auto_awesome">auto_awesome</span>
            Describe
        </button>
<button class="flex-1 h-[52px] rounded-[16px] border border-white text-white font-label font-medium flex items-center justify-center gap-2 hover:bg-white/10 transition-colors active:opacity-70">
<span class="material-symbols-outlined" data-icon="delete">delete</span>
            Delete
        </button>
</footer>
</body></html>
