            "fontSize": {}

      }

<style>
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: #FFFFFF;
            color: #3A2A30;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

      min-height: max(884px, 100dvh);
    }

<body class="bg-[#FFFFFF] min-h-screen flex flex-col">
<!-- TopAppBar -->
<header class="w-full top-0 sticky bg-[#FFFFFF] dark:bg-[#1C1B1F] flex items-center h-16 px-4 w-full z-10">
<button class="mr-4 p-2 rounded-full hover:bg-[#F7A8C4]/10 dark:hover:bg-[#E97B93]/10 transition-colors active:opacity-80 transition-opacity text-[#3A2A30] dark:text-[#E6E1E5]">
<span aria-hidden="true" class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="text-[#3A2A30] dark:text-[#E6E1E5] font-headline text-lg font-medium">Reset password</h1>
</header>
<!-- Main Content -->
<main class="flex-1 px-6 pt-8 pb-12 flex flex-col items-center">
<!-- Success Card -->
<div class="w-full max-w-sm bg-[#F7A8C4]/20 rounded-[20px] p-6 mb-8 text-center flex flex-col items-center">
<span aria-hidden="true" class="material-symbols-outlined text-[#3A2A30] text-3xl mb-4">mail</span>
<h2 class="font-headline font-medium text-xl text-[#3A2A30] mb-2">Check your email</h2>
<p class="font-body text-[#3A2A30]/80 leading-relaxed text-sm">
                If an account exists for jo@example.com, a reset link is on its way.
            </p>
</div>
<!-- Action Button -->
<a class="font-label font-medium text-[#3A2A30] hover:text-[#3A2A30]/70 transition-colors py-3 px-6 rounded-full hover:bg-[#F7A8C4]/10 active:opacity-80" href="#">

        </a>
