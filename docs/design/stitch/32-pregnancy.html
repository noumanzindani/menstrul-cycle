<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Pregnancy - LunaTrack</title>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<!-- Material Symbols -->
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<!-- Tailwind CSS -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Tailwind Config -->
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: '#FFFFFF',
                        surface: '#FFFFFF',
                        primary: '#3A2A30',
                        seed: '#F7A8C4',
                        cardSurface: '#FDF2F6', // Soft pink tint derived from seed
                        menstrual: '#D64F6E',
                        follicular: '#6FB3A8',
                        ovulatory: '#7E9CE8',
                        luteal: '#D9A15B',
                        fertile: '#9CCFC6',
                        predicted: '#B0A8C0',
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "1.25rem", // 20dp
                        "button": "1rem", // 16dp
                        "full": "9999px"
                    },
                    spacing: {
                        'button': '3.25rem', // 52dp
                    },
                    fontFamily: {
                        headline: ["Public Sans", "sans-serif"],
                        display: ["Public Sans", "sans-serif"],
                        body: ["Public Sans", "sans-serif"],
                        label: ["Public Sans", "sans-serif"]
                    },
                    boxShadow: {
                        'flat': 'none',
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.primary');
            -webkit-tap-highlight-color: transparent;
        }
        
        /* Material Icon base styling */
        .material-symbols-outlined {
            font-variation-settings:
            'FILL' 0,
            'wght' 400,
            'GRAD' 0,
            'opsz' 24;
            display: inline-block;
            vertical-align: middle;
            line-height: 1;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="antialiased min-h-screen flex flex-col bg-background text-primary selection:bg-seed/30 mx-auto max-w-[360px] overflow-x-hidden relative pb-[50px]">
<!-- TopAppBar -->
<header class="flex items-center px-4 h-16 w-full top-0 sticky bg-white dark:bg-[#1C1B1F] z-50">
<button aria-label="Go back" class="mr-4 p-2 -ml-2 rounded-full hover:bg-black/5 dark:hover:bg-white/5 transition-colors active:opacity-70 transition-opacity flex items-center justify-center text-[#3A2A30] dark:text-[#E6E1E5]">
<span class="material-symbols-outlined text-2xl" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-headline text-xl font-semibold text-[#3A2A30] dark:text-[#E6E1E5] flex-1 truncate">Pregnancy</h1>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 px-4 py-2 flex flex-col gap-4 w-full">
<!-- Section 1 & 2: Hero Card -->
<section class="bg-cardSurface rounded-2xl p-6 flex flex-col items-center justify-center text-center shadow-flat w-full">
<h2 class="font-display text-4xl font-semibold tracking-tight text-primary mb-1">Week 14</h2>
<p class="font-body text-base font-medium text-primary/80 mb-8">Second trimester</p>
<!-- Trimester Progress (Section 2) -->
<div class="w-full max-w-[240px] flex flex-col gap-2">
<div class="flex gap-1 h-2 w-full">
<!-- Trimester 1 (Filled) -->
<div class="flex-1 bg-seed rounded-l-full overflow-hidden relative">
<div class="absolute inset-0 bg-seed w-full"></div>
</div>
<!-- Trimester 2 (33% filled) -->
<div class="flex-1 bg-predicted/30 overflow-hidden relative">
<div class="absolute inset-y-0 left-0 bg-seed w-[33%] rounded-r-sm"></div>
</div>
<!-- Trimester 3 (Empty) -->
<div class="flex-1 bg-predicted/30 rounded-r-full overflow-hidden">
</div>
</div>
<div class="flex justify-between w-full px-1">
<span class="font-label text-[10px] text-primary/60 uppercase tracking-wider text-center w-1/3">1st</span>
<span class="font-label text-[10px] text-primary/60 uppercase tracking-wider text-center w-1/3">2nd</span>
<span class="font-label text-[10px] text-primary/60 uppercase tracking-wider text-center w-1/3">3rd</span>
</div>
</div>
</section>
<!-- Section 3: Due Date Card -->
<section class="bg-cardSurface rounded-2xl p-5 flex flex-col shadow-flat w-full">
<div class="flex items-center gap-2 mb-1">
<span class="w-2 h-2 rounded-full bg-predicted"></span>
<span class="font-label text-sm font-medium text-primary/70">Estimated due date</span>
</div>
<div class="flex items-baseline justify-between w-full mt-1">
<p class="font-display text-2xl font-medium text-primary">12 March 2027</p>
<span class="inline-flex items-center px-2 py-0.5 rounded-full bg-predicted/20 text-primary font-label text-[11px] font-medium tracking-wide">
                    estimate
                </span>
</div>
</section>
<!-- Section 4: Weeks to go Card -->
<section class="bg-cardSurface rounded-2xl p-5 flex flex-col shadow-flat w-full">
<div class="flex items-center gap-2 mb-1">
<span class="w-2 h-2 rounded-full bg-seed"></span>
<span class="font-label text-sm font-medium text-primary/70">Weeks to go</span>
</div>
<p class="font-display text-2xl font-medium text-primary mt-1">26 weeks</p>
</section>
<!-- Section 5: Fine-print Disclaimer -->
<section class="flex items-start gap-3 p-4 bg-background mt-2">
<span class="material-symbols-outlined text-primary/40 text-lg mt-0.5" data-icon="info">info</span>
<p class="font-body text-xs leading-relaxed text-primary/60">
                Dates are estimates based on the last period you logged. Your clinician's dating takes precedence.
            </p>
</section>
<!-- Spacer to push button to bottom if screen is tall enough -->
<div class="flex-1 min-h-[24px]"></div>
<!-- Section 6: End Tracking Button -->
<section class="mt-auto pt-4 pb-8 w-full">
<button class="w-full h-button rounded-button border border-primary/20 text-primary font-label text-base font-medium flex items-center justify-center hover:bg-black/5 active:bg-black/10 transition-colors shadow-flat">
                End pregnancy tracking
            </button>
</section>
</main>
<!-- Ad Banner Slot (Absolute pinned to bottom above nav if nav existed, but no nav here due to focus) -->
<div class="w-[320px] h-[50px] bg-black/5 mx-auto flex items-center justify-center absolute bottom-0 left-0 right-0 text-primary/30 text-xs font-label">
        Advertisement
    </div>
</body></html>
