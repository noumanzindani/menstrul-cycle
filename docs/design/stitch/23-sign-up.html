<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LunaTrack - Create Account</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        background: "#FFFFFF",
                        surface: "#FFFFFF",
                        "on-surface": "#3A2A30",
                        primary: "#F7A8C4",
                        "primary-container": "#FDE8EE",
                        "on-primary-container": "#3A2A30",
                        error: "#D64F6E",
                        outline: "#B0A8C0",
                        "outline-variant": "#E1DFE6",
                        muted: "#6E6885",
                        "surface-variant": "#F8F6FA",
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "full": "9999px",
                        "card": "20px",
                        "button": "16px",
                    },
                    fontFamily: {
                        "headline": ["Public Sans", "sans-serif"],
                        "display": ["Public Sans", "sans-serif"],
                        "body": ["Public Sans", "sans-serif"],
                        "label": ["Public Sans", "sans-serif"],
                    },
                    spacing: {
                        "52dp": "52px",
                    }
                },
            },
        }
    </script>
<style>
        body {
            font-family: 'Public Sans', sans-serif;
            background-color: theme('colors.background');
            color: theme('colors.on-surface');
            -webkit-font-smoothing: antialiased;
        }
        
        /* Floating label styles */
        .input-group {
            position: relative;
        }
        
        .input-group input {
            padding: 1rem 1rem 0.5rem 1rem;
            min-height: 56px;
        }
        
        .input-group label {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            transition: all 0.2s ease;
            pointer-events: none;
            color: theme('colors.muted');
            font-size: 1rem;
        }
        
        .input-group input:focus + label,
        .input-group input:not(:placeholder-shown) + label {
            top: 0.5rem;
            transform: translateY(0);
            font-size: 0.75rem;
            color: theme('colors.on-surface');
        }
        
        .input-group input:focus {
            border-color: theme('colors.on-surface');
            ring-color: theme('colors.on-surface');
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center justify-start bg-background text-on-surface antialiased">
<!-- Container for mobile portrait layout (max width 360px per prompt) -->
<main class="w-full max-w-[360px] min-h-screen relative flex flex-col px-6 pt-12 pb-8 overflow-y-auto">
<!-- Back Button -->
<button aria-label="Go back" class="absolute top-12 left-6 w-10 h-10 flex items-center justify-center rounded-full hover:bg-surface-variant transition-colors active:scale-95 text-on-surface" type="button">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<!-- Spacer for top area -->
<div class="h-16"></div>
<!-- Branding / Hero -->
<div class="flex flex-col items-center justify-center mb-10 mt-8">
<!-- Small pink ring mark -->
<div class="w-10 h-10 rounded-full border-[6px] border-primary mb-4"></div>
<!-- Wordmark -->
<h1 class="font-display font-bold text-2xl tracking-tight text-on-surface">LunaTrack</h1>
</div>
<!-- Headline -->
<h2 class="font-headline font-semibold text-2xl mb-8 text-left w-full text-on-surface">Create your account</h2>
<!-- Form Fields -->
<form class="w-full flex flex-col gap-6" onsubmit="event.preventDefault();">
<!-- Email Field -->
<div class="input-group w-full">
<input class="w-full bg-transparent border-2 border-outline-variant rounded-md focus:ring-0 focus:border-on-surface transition-colors text-on-surface" id="email" placeholder=" " required="" type="email"/>
<label class="font-label" for="email">Email</label>
</div>
<!-- Password Field -->
<div class="input-group w-full relative">
<input class="w-full bg-transparent border-2 border-outline-variant rounded-md focus:ring-0 focus:border-on-surface transition-colors pr-12 text-on-surface" id="password" placeholder=" " required="" type="password"/>
<label class="font-label" for="password">Password</label>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-on-surface p-1 rounded-full active:bg-surface-variant" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<!-- Confirm Password Field with Error -->
<div class="w-full flex flex-col gap-2">
<div class="input-group w-full relative">
<input class="w-full bg-transparent border-2 border-outline-variant rounded-md focus:ring-0 focus:border-on-surface transition-colors pr-12 text-on-surface" id="confirm_password" placeholder=" " required="" type="password" value="some_typo"/>
<label class="font-label" for="confirm_password">Confirm password</label>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-muted hover:text-on-surface p-1 rounded-full active:bg-surface-variant" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<!-- Validation Message -->
<p class="text-sm text-error font-body px-1">Passwords don't match yet.</p>
</div>
<!-- Spacer before button -->
<div class="h-2"></div>
<!-- Primary Action Button -->
<button class="w-full h-52dp bg-primary text-on-surface font-body font-medium text-base rounded-button flex items-center justify-center active:scale-[0.98] transition-transform hover:opacity-90 mt-2" type="submit">
                Create account
            </button>
</form>
<!-- Privacy Disclosure Card -->
<div class="w-full bg-primary-container rounded-card p-5 mt-10">
<p class="text-xs leading-relaxed text-on-primary-container font-body">
                Your daily logs and settings sync to our server so they reach your other devices. They're encrypted in transit and stored in plain text — which means we can read them. Photos you add are stored unencrypted.
            </p>
</div>
<!-- Spacer to push bottom text down if needed, though layout specifies flow -->
<div class="flex-grow min-h-[32px]"></div>
<!-- Plain Text Link -->
<button class="w-full py-4 text-center font-body text-sm text-muted hover:text-on-surface transition-colors mt-auto mb-2" type="button">
            Read the privacy policy
        </button>
</main>
<script>
        // Simple script to handle password visibility toggle for interaction
        document.querySelectorAll('.input-group button').forEach(button => {
            button.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const icon = this.querySelector('.material-symbols-outlined');
                
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility_off';
                }
            });
        });
    </script>
</body></html>
