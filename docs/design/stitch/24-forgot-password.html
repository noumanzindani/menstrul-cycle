<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>LunaTrack - Reset Password</title>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              surface: '#FFFFFF',
              'on-surface': '#3A2A30',
              'on-surface-variant': '#3A2A30B3',
              primary: '#F7A8C4',
              'on-primary': '#3A2A30',
              outline: '#3A2A3066',
            },
            borderRadius: {
              DEFAULT: "0.5rem",
              lg: "1rem",
              xl: "1.5rem",
              full: "9999px",
              button: "1rem",
            },
            fontFamily: {
              headline: ["Public Sans", "sans-serif"],
              display: ["Public Sans", "sans-serif"],
              body: ["Public Sans", "sans-serif"],
              label: ["Public Sans", "sans-serif"]
            },
            spacing: {
              button: "3.25rem", // 52px
            }
          },
        },
      }
    </script>
<style>
        body {
            background-color: #FFFFFF;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        /* Floating label styles for Material 3 Outlined TextField */
        .m3-textfield-input:focus ~ .m3-textfield-label,
        .m3-textfield-input:not(:placeholder-shown) ~ .m3-textfield-label {
            transform: translateY(-50%) scale(0.75);
            background-color: #FFFFFF;
            padding: 0 4px;
            color: #F7A8C4;
        }
        
        .m3-textfield-input:not(:focus):not(:placeholder-shown) ~ .m3-textfield-label {
            color: #3A2A30B3;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-surface text-on-surface font-body min-h-screen flex flex-col">
<!-- TopAppBar (from JSON) -->
<header class="w-full top-0 sticky bg-[#FFFFFF] dark:bg-[#1C1B1F] flex items-center h-16 px-4 z-10">
<button aria-label="Go back" class="mr-4 w-12 h-12 flex items-center justify-center rounded-full text-[#3A2A30] dark:text-[#E6E1E5] hover:bg-[#F7A8C4]/10 dark:hover:bg-[#E97B93]/10 transition-colors active:opacity-80">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_back</span>
</button>
<h1 class="text-[#3A2A30] dark:text-[#E6E1E5] font-headline text-lg font-medium">Reset password</h1>
</header>
<!-- Main Content -->
<main class="flex-1 px-4 pt-6 pb-8 md:px-6 max-w-md mx-auto w-full flex flex-col">
<!-- Explanation Text -->
<p class="text-on-surface font-body text-base mb-8 leading-relaxed">
            We'll email you a link to set a new password.
        </p>
<!-- Form Elements -->
<form class="flex flex-col gap-8 flex-1" onsubmit="event.preventDefault();">
<!-- Email Input (M3 Outlined) -->
<div class="relative w-full mt-2">
<input class="m3-textfield-input block w-full h-[56px] px-4 py-2 rounded-[4px] border border-outline bg-transparent text-on-surface font-body text-base focus:outline-none focus:border-2 focus:border-primary focus:ring-0 appearance-none" id="email_input" placeholder=" " required="" type="email"/>
<label class="m3-textfield-label absolute left-3 top-[18px] text-on-surface-variant font-body text-base pointer-events-none transition-all duration-200 origin-left" for="email_input">
                    Email
                </label>
</div>
<!-- Spacer to push button downwards if needed, though prompt implies standard flow -->
<div class="flex-1"></div>
<!-- Action Button -->
<button class="w-full h-button rounded-button bg-primary text-on-primary font-label text-base font-semibold active:scale-[0.98] transition-transform duration-200 flex items-center justify-center" type="submit">
                Send reset link
            </button>
</form>
</main>
</body></html>
