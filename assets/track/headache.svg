<!-- A bold zigzag striking through a ring. Deliberately NOT a head profile: the
     profile's jaw, ear and neck detail turned to mush at 16px. Reads as a
     sharp pain, and is unmistakable against the cramps starburst. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <circle cx="12" cy="12" r="8.6" fill="none" stroke="#000" stroke-width="2.4"/>
  <path d="M13.9 6.2l-4.4 5.1h4.2l-3.6 6.5"
        fill="none" stroke="#000" stroke-width="2.4"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
