<!-- Two heavy swells - queasiness as motion, not as a container. The earlier
     version drew a lidded vessel with a rippled surface; at 16px the vessel
     read as a plain box and the ripple vanished entirely. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <g fill="none" stroke="#000" stroke-width="2.6" stroke-linecap="round">
    <path d="M2.6 8.4c2.4-3.2 4.7-3.2 7.1 0s4.7 3.2 7.1 0 4.7-3.2 7.1 0"/>
    <path d="M2.6 15.6c2.4-3.2 4.7-3.2 7.1 0s4.7 3.2 7.1 0 4.7-3.2 7.1 0"/>
  </g>
</svg>
