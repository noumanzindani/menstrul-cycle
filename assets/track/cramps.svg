  <circle cx="12" cy="12" r="4" fill="#000"/>
  <g stroke="#000" stroke-width="2.6" stroke-linecap="round">
    <path d="M12 1.8v3.4M12 18.8v3.4M1.8 12h3.4M18.8 12h3.4"/>
  </g>
</svg>
