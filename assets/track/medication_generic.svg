<!-- The ONE icon shared by every user-created medication row. Medications are an
     unbounded, user-defined set (day_entry_form.dart builds a TrackOption from a
     DB row), so there can never be per-item art; artFor() maps the whole
     kMedicationKeyPrefix namespace here. -->
